{% extends 'base.html' %}
{% block content %}

<div class="sf-page">

  <!-- ── BREADCRUMB ── -->
  <div class="reveal" style="margin-bottom:24px;">
    <a href="/profile"
       style="font-size:0.8rem;color:var(--text-3);text-decoration:none;
              display:inline-flex;align-items:center;gap:5px;transition:color 0.2s;"
       onmouseover="this.style.color='var(--text-2)'"
       onmouseout="this.style.color='var(--text-3)'">
      <i class="bi bi-arrow-left"></i> Back to Profile
    </a>
  </div>

  <!-- ── CARD ── -->
  <div class="sf-card reveal" style="max-width:480px;overflow:hidden;">

    <div class="sf-table-header">
      <span>
        <i class="bi bi-key-fill me-2" style="color:var(--accent);"></i>
        Change Password
      </span>
    </div>

    <div style="padding:28px 32px;">

      <!-- Info note -->
      <div style="background:rgba(124,58,237,0.06);border:1px solid rgba(124,58,237,0.15);
                  border-radius:10px;padding:12px 16px;margin-bottom:24px;
                  font-size:0.8rem;color:var(--text-2);display:flex;gap:10px;
                  align-items:flex-start;">
        <i class="bi bi-info-circle-fill"
           style="color:var(--accent);flex-shrink:0;margin-top:1px;"></i>
        <span>
          Choose a strong password with at least 6 characters.
          You'll stay logged in after changing it.
        </span>
      </div>

      <form method="POST" action="/change-password" id="pw-form">

        <!-- Current password -->
        <div class="admin-field" style="margin-bottom:18px;">
          <label style="display:flex;align-items:center;justify-content:space-between;">
            <span>Current Password</span>
          </label>
          <div style="position:relative;">
            <input type="password" name="current_password" id="current_password"
                   required autocomplete="current-password"
                   placeholder="Enter your current password"
                   style="width:100%;padding-right:40px;">
            <button type="button" onclick="togglePw('current_password','eye-current')"
                    style="position:absolute;right:12px;top:50%;transform:translateY(-50%);
                           background:none;border:none;cursor:pointer;
                           color:var(--text-3);font-size:0.9rem;padding:0;"
                    title="Show/hide">
              <i class="bi bi-eye" id="eye-current"></i>
            </button>
          </div>
        </div>

        <!-- Divider -->
        <div style="height:1px;background:var(--border);margin:22px 0;"></div>

        <!-- New password -->
        <div class="admin-field" style="margin-bottom:18px;">
          <label>New Password</label>
          <div style="position:relative;">
            <input type="password" name="new_password" id="new_password"
                   required autocomplete="new-password" minlength="6"
                   placeholder="At least 6 characters"
                   oninput="checkStrength(this.value)"
                   style="width:100%;padding-right:40px;">
            <button type="button" onclick="togglePw('new_password','eye-new')"
                    style="position:absolute;right:12px;top:50%;transform:translateY(-50%);
                           background:none;border:none;cursor:pointer;
                           color:var(--text-3);font-size:0.9rem;padding:0;"
                    title="Show/hide">
              <i class="bi bi-eye" id="eye-new"></i>
            </button>
          </div>

          <!-- Strength meter -->
          <div style="margin-top:8px;">
            <div style="height:4px;background:var(--border);border-radius:99px;
                        overflow:hidden;margin-bottom:5px;">
              <div id="strength-bar"
                   style="height:100%;width:0%;border-radius:99px;transition:all 0.3s ease;
                          background:var(--danger,#ef4444);"></div>
            </div>
            <div id="strength-label"
                 style="font-size:0.7rem;color:var(--text-3);">
              Enter a new password
            </div>
          </div>
        </div>

        <!-- Confirm new password -->
        <div class="admin-field" style="margin-bottom:28px;">
          <label>Confirm New Password</label>
          <div style="position:relative;">
            <input type="password" name="confirm_password" id="confirm_password"
                   required autocomplete="new-password"
                   placeholder="Repeat your new password"
                   oninput="checkMatch()"
                   style="width:100%;padding-right:40px;">
            <button type="button" onclick="togglePw('confirm_password','eye-confirm')"
                    style="position:absolute;right:12px;top:50%;transform:translateY(-50%);
                           background:none;border:none;cursor:pointer;
                           color:var(--text-3);font-size:0.9rem;padding:0;"
                    title="Show/hide">
              <i class="bi bi-eye" id="eye-confirm"></i>
            </button>
          </div>
          <div id="match-label"
               style="font-size:0.7rem;color:var(--text-3);margin-top:5px;min-height:16px;">
          </div>
        </div>

        <!-- Buttons -->
        <div style="display:flex;gap:10px;">
          <button type="submit" class="btn-primary-sf" id="submit-btn"
                  style="width:auto;padding:11px 28px;">
            <i class="bi bi-check-lg"></i> Update Password
          </button>
          <a href="/profile" class="sf-btn-ghost" style="padding:11px 20px;">
            Cancel
          </a>
        </div>

      </form>

    </div>
  </div>

</div>

<script>
// Toggle show/hide password
function togglePw(fieldId, iconId) {
  const field = document.getElementById(fieldId);
  const icon  = document.getElementById(iconId);
  if (field.type === 'password') {
    field.type  = 'text';
    icon.className = 'bi bi-eye-slash';
  } else {
    field.type  = 'password';
    icon.className = 'bi bi-eye';
  }
}

// Password strength meter
function checkStrength(val) {
  const bar   = document.getElementById('strength-bar');
  const label = document.getElementById('strength-label');

  let score = 0;
  if (val.length >= 6)                          score++;
  if (val.length >= 10)                         score++;
  if (/[A-Z]/.test(val))                        score++;
  if (/[0-9]/.test(val))                        score++;
  if (/[^A-Za-z0-9]/.test(val))                score++;

  const levels = [
    { pct: '0%',   color: 'var(--danger,#ef4444)',    text: 'Enter a new password' },
    { pct: '25%',  color: 'var(--danger,#ef4444)',    text: 'Weak' },
    { pct: '50%',  color: 'var(--warning,#f59e0b)',   text: 'Fair' },
    { pct: '75%',  color: 'var(--warning,#f59e0b)',   text: 'Good' },
    { pct: '90%',  color: 'var(--success,#10b981)',   text: 'Strong' },
    { pct: '100%', color: 'var(--success,#10b981)',   text: '💪 Very strong' },
  ];

  const level = val.length === 0 ? levels[0] : levels[Math.min(score, 5)];
  bar.style.width      = level.pct;
  bar.style.background = level.color;
  label.textContent    = level.text;
  label.style.color    = val.length === 0 ? 'var(--text-3)' : level.color;

  checkMatch();
}

// Confirm field match indicator
function checkMatch() {
  const newPw     = document.getElementById('new_password').value;
  const confirmPw = document.getElementById('confirm_password').value;
  const label     = document.getElementById('match-label');

  if (!confirmPw) {
    label.textContent = '';
    return;
  }
  if (newPw === confirmPw) {
    label.textContent  = '✓ Passwords match';
    label.style.color  = 'var(--success,#10b981)';
  } else {
    label.textContent  = '✗ Passwords do not match';
    label.style.color  = 'var(--danger,#ef4444)';
  }
}

// Loading state on submit
document.getElementById('pw-form').addEventListener('submit', function () {
  const btn = document.getElementById('submit-btn');
  btn.innerHTML       = '<i class="bi bi-hourglass-split"></i> Saving...';
  btn.style.opacity   = '0.7';
  btn.style.pointerEvents = 'none';
});
</script>

{% endblock %}
